version: '3.8'

services:
  postgres:
    image: postgres:15-alpine
    container_name: erp_postgres
    environment:
      POSTGRES_USER: erp_user
      POSTGRES_PASSWORD: erp_password
      POSTGRES_DB: erp_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: erp_redis
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    restart: unless-stopped

  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: erp_api
    ports:
      - "3001:3001"
    environment:
      - DATABASE_URL=postgresql://erp_user:erp_password@erp_postgres:5432/erp_db?schema=public
      - REDIS_URL=redis://erp_redis:6379
      - PORT=3001
    depends_on:
      - postgres
      - redis
    restart: unless-stopped

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
    container_name: erp_web
    ports:
      - "3000:3000"
    environment:
      - NEXT_PUBLIC_API_URL=http://ventech/api
      - PORT=3000
      - HOSTNAME=0.0.0.0
    depends_on:
      - api
    restart: unless-stopped

volumes:
  postgres_data:
  redis_data:
