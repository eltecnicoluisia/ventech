<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <title>Error — VENTECH ERP</title>
  <style>
    * { margin:0; padding:0; box-sizing:border-box; }
    body { background:#18181b; font-family:'Segoe UI',sans-serif; color:#e4e4e7; display:flex; align-items:center; justify-content:center; height:100vh; }
    .box { text-align:center; display:flex; flex-direction:column; align-items:center; gap:16px; max-width:400px; padding:40px; background:#1c1c1f; border:1px solid #27272a; border-radius:20px; }
    .icon { font-size:48px; }
    h2 { font-size:18px; font-weight:700; color:white; }
    p { font-size:13px; color:#71717a; line-height:1.6; }
    button { padding:12px 24px; background:#2563eb; border:none; border-radius:10px; color:white; font-size:13px; font-weight:700; cursor:pointer; }
    button:hover { background:#1d4ed8; }
  </style>
</head>
<body>
  <div class="box">
    <div class="icon">⚠️</div>
    <h2>No se pudo conectar al servidor</h2>
    <p>Verifica que el servidor VENTECH esté encendido y que estés conectado a la misma red.</p>
    <button onclick="location.reload()">Reintentar</button>
  </div>
</body>
</html>
